<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cadastro - HF Controll</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="auth.css" />
    <meta name="theme-color" content="#4A2410" />
  </head>
  <body>
    <div class="container px-4">
      <div class="login-card">
        <div class="text-center mb-4">
          <div class="brand-icon mb-2">
            <i class="fa-solid fa-horse-head"></i>
          </div>
          <h3 class="auth-title">Criar conta</h3>
          <p class="auth-subtitle mt-1">HF Controll — Gestão do Rancho</p>
        </div>

        <form id="formCadastro">
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-signature"></i></span>
            <input type="text" class="form-control" id="nome" placeholder="Nome completo" required autocomplete="name" />
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input type="text" class="form-control" id="username" placeholder="Nome de usuário" required autocapitalize="none" autocomplete="username" />
          </div>

          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="E-mail" required autocomplete="email" />
          </div>

          <div class="input-group mb-4">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="senha" placeholder="Senha (mín. 6 caracteres)" required minlength="6" autocomplete="new-password" />
          </div>

          <div id="msgErro" class="alert alert-danger d-none py-2 small text-center rounded-3" role="alert"></div>
          <div id="msgSucesso" class="alert alert-success d-none py-2 small text-center rounded-3" role="alert"></div>

          <button type="submit" class="btn btn-primary w-100 btn-login" id="btnCadastrar">
            <i class="fa-solid fa-user-plus me-2"></i> Criar conta
          </button>
        </form>

        <div class="divider mt-4"><span>Já tem conta?</span></div>
        <div class="text-center">
          <a href="login.html" class="small" style="color: var(--marrom-claro); text-decoration: none; font-weight: 600;">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Fazer login
          </a>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("formCadastro").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("btnCadastrar");
        const msgErro = document.getElementById("msgErro");
        const msgSucesso = document.getElementById("msgSucesso");

        msgErro.classList.add("d-none");
        msgSucesso.classList.add("d-none");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Criando...';

        try {
          const res = await fetch("/api/auth/cadastro", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nome: document.getElementById("nome").value.trim(),
              username: document.getElementById("username").value.trim(),
              email: document.getElementById("email").value.trim(),
              senha: document.getElementById("senha").value,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            msgErro.textContent = data.message || "Erro ao criar conta.";
            msgErro.classList.remove("d-none");
            return;
          }

          msgSucesso.textContent = "Conta criada! Redirecionando para o login...";
          msgSucesso.classList.remove("d-none");
          document.getElementById("formCadastro").reset();
          setTimeout(() => { window.location.href = "login.html"; }, 2000);
        } catch (err) {
          msgErro.textContent = "Erro de conexão. Tente novamente.";
          msgErro.classList.remove("d-none");
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i> Criar conta';
        }
      });
    </script>
  </body>
</html>
